name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.25.8
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"

      - name: Build
        run: go build -v ./...
